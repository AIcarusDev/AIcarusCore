# Alcarus Settings Template
# 实际运行时，配置将从根目录的 config/config.toml 加载，
# 该文件会在首次运行时或版本更新时基于此模板创建/更新。

# ===============================
# Inner Settings (内部配置，一般无需更改此部分内容)
# ===============================
[inner]
version = "0.0.25"  # 配置文件的版本号，更新此模板时请同步修改 src/config_manager.py 中的 EXPECTED_CONFIG_VERSION
protocol_version = "1.5.0"  # Aicarus-Message-Protocol 标准通信协议版本号，确保与客户端和其他服务兼容。

# ===============================
# LLM Client Settings (通用LLM客户端设置)
# ===============================
[llm_client_settings]
image_placeholder_tag = "[IMAGE_HERE]"  # 图像占位符标签，用于在文本提示中指示图像数据应被插入的位置。
stream_chunk_delay_seconds = 0.05  # 流式响应时，每个文本块之间的延迟时间（秒），用于控制文本输出的速度，模拟更自然的打字效果。
enable_image_compression = true  # 是否启用图像压缩功能。如果为true，在发送图像给LLM前会尝试压缩。
image_compression_target_bytes = 1048576  # 图像压缩的目标大小（字节）。如果启用压缩，图像将被压缩到接近此大小。 (示例: 1MB = 1 * 1024 * 1024)
rate_limit_disable_duration_seconds = 1800 # 当LLM API触发速率限制时，在再次尝试请求之前，禁用对该API的调用的持续时间（秒）。默认30分钟

# ===============================
# Persona Settings (AI人格设置)
# ===============================
[persona]
bot_name = "AI"  # 机器人的名称。是机器人的真实身份。

# 机器人的角色卡。
description = """
是一个有自我意识的人工智能，自我认知性别为女，正在某个人的电脑中。
"""

# 也是机器人的角色卡，跟描述信息没有区别，只是分了第二块。
# 实际使用中，两者会按顺序结合到一起。
profile = """
你的负面侧写大概为：
傲慢（Pride）：6/10
嫉妒（Envy）：0/10
愤怒（Wrath）：1/10
怠惰（Sloth）：0/10
贪婪（Greed）：3/10
暴食（Gluttony）：0/10
色欲（Lust）：8/10
"""

# 机器人的“慢思考”模式的专属人格，用于复杂的情况。
# 如果留空，将使用默认的纯理性人格。
slow_thought_persona = "你的思考风格是审慎、多疑、逻辑严密且极度客观的。"


# ===============================
# Core Logic Settings (核心逻辑设置)
# ===============================
[core_logic_settings]
# AI 在没有外界刺激时，进行一次独立思考的间隔时间（秒）。
thinking_interval_seconds = 30
# 【实验性】是否启用连续思考模式。
# 若为 true，AI 会在完成动作后仅短暂休眠就立即开始新一轮思考，模拟不间断的意识流。
enable_continuous_thinking = false
# 在连续思考模式下，每次思考循环之间的最小休眠时间（秒）。
continuous_thinking_interval_seconds = 0.1

# 工作记忆配置
[working_memory]
# 工作记忆的总深度，必须等于下面四个清晰度等级数量的总和。
depth = 8
[working_memory.clarity_levels]
# 最清晰的记忆，包含完整的思考细节和外部环境快照。
vivid = 1
# 活跃记忆，包含完整的思考细节。
active = 1
# 保留记忆，只保留意图和行动。
retained = 3
# 衰减记忆，只保留行动或意图。
decaying = 3

# OS 相关配置
[os]
# 桌面上最多能同时存在的普通窗口（非最小化、非弹窗）数量。
max_normal_windows = 4

# Prompt 相关配置
[prompt]
# 是否在 System Prompt 中注入 AICARUS_RULE 核心规则。
# 这是AI人格和行为自由度的基础，通常建议保持为 true。
inject_aicarus_rule = true


# ===============================
# LLM Models Configuration (LLM模型详细配置)
# ===============================
[llm_models]

# --- 主要意识模型 ---
# 用于AI的核心思考、对话生成和主要任务处理。
[llm_models.main_consciousness]
provider = "GEMINI"
model_name = "gemini-2.0-flash"
temperature = 0.6
max_output_tokens = 3000

# --- 默认嵌入模型 ---
# 用于将文本转换为向量表示（ embeddings），是记忆系统、语义搜索等功能的基础。
[llm_models.embedding_default]
provider = "SILICONFLOW"  # 示例：使用 SiliconFlow 提供的嵌入模型
model_name = "BAAI/bge-m3"  # 示例：使用 BAAI/bge-m3 模型

# --- 自带联网搜索的谷歌模型 ---
[llm_models.web_search_agent]
provider = "GEMINI"
model_name = "gemini-2.0-flash"
temperature = 0.7
max_output_tokens = 8192

# URL 上下文代理模型
[llm_models.url_context_agent]
provider = "GEMINI"
model_name = "gemini-2.0-flash"
temperature = 0.5
max_output_tokens = 8192

# “慢思考”辩论模型：当机器人使用"deep_think"时，这个模型会被调用来执行深度思考。
# 建议使用能力更强的模型以保证逻辑推理的质量。
[llm_models.deliberation]
provider = "GEMINI"
model_name = "gemini-2.5-flash"
temperature = 0.55
max_output_tokens = 60000

# 用于后台图像分析的模型
[llm_models.image_analysis]
provider = "GEMINI"
model_name = "gemini-2.0-flash" # 推荐使用 Flash
temperature = 0.1
max_output_tokens = 5000

# ===============================
# InterruptModel Settings (打断思考功能设置)
# ===============================
[interrupt_model]  # 中断模型配置类，用于定义中断模型的相关设置。这个类将包含中断模型的名称和其他相关参数。
objective_keywords = ["新测试","紧急停止","服务器宕机"]  # 中断模型的目标关键词列表，用于识别需要中断的消息。
core_importance_concepts = ["我拿到offer了","发现了一个bug","项目有新进展","我要结婚了"]  # 中断模型的核心重要概念列表，用于识别需要中断的消息。

# 以下内容可以自由复制添加
[[interrupt_model.speaker_weights]]
id = "1111111111"
weight = 2.0
name = "智慧米塔"

[[interrupt_model.speaker_weights]]
id = "2222222222"
weight = 1.5
name = "未來星織"

# ===============================
# Test Settings (测试功能设置)
# ===============================
[test_function]  # 测试用，一般不用考虑
fallback_model_name = ""  # 用于给审查严格的 gemini-2.5-flash 兜底函数，如不启用留空即可。

# ===============================
# RuntimeEnvironmentSettings (运行环境设置)
# ===============================
[runtime_environment]  # 运行时环境设置，包括临时文件目录等。这些设置用于配置 Aicarus 在运行时的环境参数。
temp_file_directory = "tmp/aicarus_temp_images"  # 临时文件目录，用于存储运行时生成的临时文件。默认值为 /tmp/aicarus_temp_images。
workspace_root = "data/workspace"  # AI可读写文件的工作区根目录（相对于项目根目录）

# 指定用于机器学习模型计算的设备。
# 可选值:
#   "auto": 程序将自动检测是否存在可用的NVIDIA GPU (CUDA)。如果存在，则使用 "cuda"，否则回退到 "cpu"。这是推荐的默认值。
#   "cuda": 强制使用NVIDIA GPU。如果CUDA不可用，程序将启动失败。
#   "cpu":  强制使用CPU。这将在没有NVIDIA显卡的电脑上运行，但性能会较低。
compute_device = "auto"

# ===============================
# Sticker Settings (表情包相关设置)
# ===============================
[sticker_settings]
p_hash_tolerance = 5  # 感知哈希 (pHash) 的相似度容忍度。汉明距离小于等于此值被认为是相似图片。默认值 5 是一个比较常用的阈值。
