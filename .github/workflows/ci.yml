name: CI Pipeline (Lint & Test)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-test:
    name: Code Linting and Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-mock ruff

      - name: Run Ruff Linter and Formatter
        # 使用 chartboost/ruff-action 来获得带标注的检查结果
        uses: chartboost/ruff-action@v1
        with:
          # 我们希望它同时执行 lint 和 format 检查
          args: "check --output-format=github ." # `check` 会读取 pyproject.toml 的配置
                                                 # `output-format=github` 是生成标注的关键
          # 你也可以分开写两个步骤，一个 check，一个 format，但合在一起更简洁
          # args: "format --check --diff ." # 如果只想检查格式，可以这样写

      - name: Run tests with pytest
        env:
          DOT_ENV_FILE: ${{ secrets.DOT_ENV_FILE }}
        run: |
          echo "Creating .env file from secrets..."
          echo "${DOT_ENV_FILE}" > .env
          echo "Running pytest..."
          pytest